# Podcasts Nate has written and/or hosted, in the order they should appear.
# See "How to add a podcast" in CLAUDE.md.
#
# An episode with `audio:` plays on the page; one without links to its page instead. The
# audio address is the episode's `enclosure url` in the show's RSS feed, and its hosts
# must be in AUDIO_HOSTS (src/config/csp.mjs).

- id: darknet-diaries
  name: "Darknet Diaries"
  role: Scriptwriter and researcher
  description: "True stories from the dark side of the internet: hackers, breaches, cybercrime and the people behind them, hosted by Jack Rhysider."
  links:
    apple: https://podcasts.apple.com/us/podcast/darknet-diaries/id1296350485
    website: https://darknetdiaries.com/
  episodes:
    - title: "177: National Public Data"
      date: 2026-07-21
      summary: "The hacker known as USDoD, and the massive breach of background-check company National Public Data."
      audio: https://www.podtrac.com/pts/redirect.mp3/dovetail.prxu.org/7057/791c66f0-0bfc-420d-96a3-816c78a17f4c/darknet-diaries-ep177-national-public-data.mp3
      url: https://darknetdiaries.com/episode/177/
      transcript: https://darknetdiaries.com/transcript/177/
    - title: "169: MoD"
      date: 2026-01-20
      summary: "Masters of Deception, the New York hacker crew that feuded with the Legion of Doom in the early 1990s."
      audio: https://www.podtrac.com/pts/redirect.mp3/dovetail.prxu.org/7057/9d4c34be-a7df-41c7-a0da-5269b660e688/darknet-diaries-ep169-mod.mp3
      url: https://darknetdiaries.com/episode/169/
      transcript: https://darknetdiaries.com/transcript/169/

