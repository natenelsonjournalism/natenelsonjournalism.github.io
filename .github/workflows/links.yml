name: Monthly site check

# Checks every outbound link (clips, appearances, write-ups) and security.txt's expiry
# date. If anything needs fixing, it opens one GitHub issue (or updates the open one),
# and closes it once everything passes again. It runs on its own schedule and never
# blocks a deploy.

on:
  schedule:
    - cron: '17 9 1 * *' # 1st of each month, 09:17 UTC
  workflow_dispatch: # "Run workflow" button on the Actions tab

permissions: {}

concurrency:
  group: monthly-site-check
  cancel-in-progress: false

jobs:
  check:
    name: Check links and security.txt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        id: check
        run: node scripts/check-links.mjs --report "$RUNNER_TEMP/report.md"

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROBLEMS: ${{ steps.check.outputs.problems }}
          REPORT: ${{ runner.temp }}/report.md
          TITLE: 'Monthly site check: broken links or expiring security.txt'
        run: |
          existing=$(gh issue list --state open --author app/github-actions --limit 100 \
            --json number,title --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ "$PROBLEMS" -gt 0 ]; then
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file "$REPORT"
            else
              gh issue create --title "$TITLE" --body-file "$REPORT"
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "All links and security.txt pass as of $(date -u +%F). Closing."
          fi
