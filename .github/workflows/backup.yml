name: Back up to GitLab

# Copies every branch and tag of this repository to a private GitLab project, so the
# site's history survives even if the GitHub account is lost. Runs after every change to
# `main`, once a week (to pick up other branches), and from the "Run workflow" button.
#
# Setup (done once by Nate, see CLAUDE.md):
#   - secret   GITLAB_BACKUP_TOKEN  a GitLab fine-grained personal access token limited to
#                                   the backup project, with only "Code: Push" and
#                                   "Code: Download". It expires within a year: renew it then.
#   - variable GITLAB_BACKUP_REPO   the project's HTTPS address, https://gitlab.com/<user>/<project>.git
#
# Nothing is ever deleted on GitLab: branches removed here stay there. GitLab keeps `main`
# protected against force pushes, so if this repository's `main` were ever rewritten, the
# backup refuses the change and this workflow fails (GitHub emails a failure notice).
# No third-party actions; the public repository is fetched without credentials.

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 0' # Sundays, 04:41 UTC
  workflow_dispatch: # "Run workflow" button on the Actions tab

permissions: {}

concurrency:
  group: gitlab-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Push to GitLab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Copy branches and tags to GitLab
        env:
          TOKEN: ${{ secrets.GITLAB_BACKUP_TOKEN }}
          GITLAB_REPO: ${{ vars.GITLAB_BACKUP_REPO }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ] || [ -z "$GITLAB_REPO" ]; then
            echo "::error::Backup isn't set up: add the GITLAB_BACKUP_TOKEN secret and the GITLAB_BACKUP_REPO variable (see CLAUDE.md)."
            exit 1
          fi
          # The token is only ever sent to GitLab.com, over HTTPS.
          case "$GITLAB_REPO" in
            https://gitlab.com/*) ;;
            *) echo "::error::GITLAB_BACKUP_REPO must be the project's https://gitlab.com/... address."; exit 1 ;;
          esac

          git init --quiet --bare backup.git
          cd backup.git
          git fetch --quiet --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" \
            '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'

          # Sent as a header for this one command, so the token is never written to disk.
          auth=$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://gitlab.com/.extraHeader=Authorization: Basic $auth" \
            push "$GITLAB_REPO" '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
          echo "Backed up $(git for-each-ref --format=x refs/heads | wc -l) branch(es) at $(git rev-parse --short main) on main." >> "$GITHUB_STEP_SUMMARY"
