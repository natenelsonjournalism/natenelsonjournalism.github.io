name: Accessibility

# Runs axe-core's WCAG 2.2 A/AA checks on every page of the built site, in light and
# dark mode, using the runner's Google Chrome. Dev tooling only: nothing here ships
# to the site. Read-only; separate from the deploy so it never holds one up, but a
# failure shows as a red check on the pull request.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a11y:
    name: Accessibility check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check accessibility
        run: npm run a11y
